name: ReleaseTrace CI & Release Ingestion

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-ingest:
    name: Build, Test & Dispatch Release Event
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    env:
      DATABASE_URL: "postgresql://ci_runner:ci_runner@localhost:5432/releasetrace_ci_test"
      DIRECT_URL: "postgresql://ci_runner:ci_runner@localhost:5432/releasetrace_ci_test"
      HINDSIGHT_BASE_URL: "https://api.hindsight.vectorize.io"
      HINDSIGHT_USE_MOCK: "true"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Prisma Schema Validation
        run: npx prisma validate

      - name: Run ESLint
        run: npm run lint

      - name: Run Test Suite
        run: npm run test

      - name: Production Build Check
        run: npm run build

      - name: Collect & Dispatch Signed CI Verification Event
        if: always()
        run: |
          BUILD_STATUS="${{ job.status }}"
          echo "Job Status: $BUILD_STATUS"
          if [ "$BUILD_STATUS" = "success" ]; then
            node scripts/collect-deployment-metadata.mjs --ignore-connection-failure
          else
            node scripts/collect-deployment-metadata.mjs --build-failed --ignore-connection-failure
          fi
        env:
          RELEASETRACE_WEBHOOK_SECRET: ${{ secrets.RELEASETRACE_WEBHOOK_SECRET }}
          RELEASETRACE_ENDPOINT: ${{ secrets.RELEASETRACE_ENDPOINT || 'https://releasetrace.vercel.app/api/webhooks/deployments' }}
          RELEASETRACE_PROJECT_ID: ${{ vars.RELEASETRACE_PROJECT_ID || 'proj_releasetrace_core' }}
          RELEASETRACE_PROJECT_NAME: ${{ vars.RELEASETRACE_PROJECT_NAME || 'ReleaseTrace Core' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
